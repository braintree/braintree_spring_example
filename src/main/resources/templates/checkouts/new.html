<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Braintree Checkout</title>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <link rel="stylesheet" type="text/css" href="/css/app.css" th:href="@{/css/app.css}" />
  <link rel="icon" type="image/png" href="/images/favicon.png" th:href="@{/images/favicon.png}" />
</head>

<body>
  <header class="main">
    <div class="container wide">
      <div class="content slim">
        <div class="set">
          <div class="fill">
            <a class="pseudoshop" href="/">PSEUDO<strong>SHOP</strong></a>
          </div>

          <div class="fit">
            <a class="braintree" href="https://developer.paypal.com/braintree/docs/start/tutorial-hosted-fields-node/"
              target="_blank">Braintree</a>
          </div>
        </div>
      </div>
    </div>
    <div class="notice-wrapper">
      <div class="show notice error notice-error" th:if="${errorDetails}">
        <span class="notice-message" th:text="${errorDetails}"></span>
      </div>
    </div>
  </header>

  <div class="wrapper">
    <div class="checkout container">

      <header>
        <h1>Hi, <br />Let's test a transaction</h1>
        <p>
          Make a test payment with Braintree a card
        </p>
      </header>

      <form id="hosted-fields-wrapper" class="hosted-fields-wrapper" method="post" action="/checkouts">
        <label for="amount">
          <span class="input-label">Amount</span>
          <input id="amount" class="hosted-field" name="amount" type="tel" min="1" placeholder="Amount" value="10" />
        </label>
        <label for="card-number">
          <span class="input-label">Card Number</span>
          <div id="card-number" class="hosted-field"></div>
        </label>
        <label for="cvv">
          <span class="input-label">CVV</span>
          <div id="cvv" class="hosted-field"></div>
        </label>
        <label for="expiration-date">
          <span class="input-label">Expiration Date</span>
          <div id="expiration-date" class="hosted-field"></div>
        </label>

        <input type="hidden" id="nonce" name="payment_method_nonce" />
        <button class="button" type="submit"><span>Test Transaction</span></button>
      </form>
    </div>
  </div>

  <script src="https://js.braintreegateway.com/web/3.143.0/js/client.min.js"></script>
  <script src="https://js.braintreegateway.com/web/3.143.0/js/hosted-fields.min.js"></script>
  <script th:inline="javascript">
    /*<![CDATA[*/
    var form = document.querySelector('#hosted-fields-wrapper');
    var client_token = [[${ clientToken }]];

    braintree.client.create({
      authorization: client_token,
    }, function (clientErr, clientInstance) {
      if (clientErr) {
        console.log('Error', clientErr);
      }
      window.braintree.hostedFields.create(
        {
          client: clientInstance,
          styles: {
            input: {
              'font-size': '16px',
              color: '#393536',
            },
          },
          fields: {
            number: {
              selector: '#card-number',
              placeholder: '4111 1111 1111 1111'
            },
            expirationDate: {
              selector: '#expiration-date',
              placeholder: '12/2030'
            },
            cvv: {
              selector: '#cvv',
              placeholder: '123'
            },
          },
        }, function (hostedFieldsErr, hostedFieldsInstance) {
          if (hostedFieldsErr) {
            console.log('Error', hostedFieldsErr);
            return;
          }
          form.addEventListener('submit', function (event) {
            event.preventDefault();

            hostedFieldsInstance.tokenize(function (err, payload) {
              if (err) {
                console.log('Error', err);

                return;
              }

              // Add the nonce to the form and submit
              document.querySelector('#nonce').value = payload.nonce;
              form.submit();
            })
          })
        });
    });
    /*]]>*/
  </script>
  <script src="/javascript/demo.js" th:src="@{/javascript/demo.js}"></script>
</body>

</html>
